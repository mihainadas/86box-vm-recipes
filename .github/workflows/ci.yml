name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-safety:
    name: Repository safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run repository-safety suite
        run: ./scripts/check.sh --require-optional repository-safety

  boot-floppy-builder:
    name: Boot-floppy builder
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install FAT image tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes mtools

      - name: Exercise builder with disposable placeholders
        run: ./scripts/check.sh --require-optional boot-floppy

  software-media:
    name: Software media
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ISO tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes xorriso

      - name: Exercise media builder with disposable placeholders
        run: ./scripts/check.sh --require-optional software-media

  macos-launcher:
    name: macOS launcher
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install FAT and ISO image tools
        run: brew install mtools xorriso

      - name: Run all macOS checks
        run: ./scripts/check.sh all
